version: "3.9"

services:
  db:
    image: postgres:15
    container_name: web-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - web_db_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: web-web
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: ["./wait-for-it.sh", "db:5432", "--timeout=30", "--strict", "--", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  web_db_data: