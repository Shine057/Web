services:
  fastapi_app:
    build: .
    ports:
      - "4200:8000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web_db
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
    depends_on:
      - postgres_db

  postgres_db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web_db
    ports:
      - "5432:5432"
    volumes:
      - web_postgres_data:/var/lib/postgresql/data

volumes:
  web_postgres_data: